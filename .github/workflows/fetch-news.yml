name: Fetch crypto news and market posts

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this slightly under load - that's normal.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

permissions:
  contents: write # needed so the workflow can commit the updated json files back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and tag news
        run: node fetch-news.js

      - name: Fetch Telegram market posts
        run: node fetch-market-posts.js

      - name: Commit updated json files
        run: |
          git config user.name "CryptoFlash Bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json market-posts.json
          git diff --staged --quiet || git commit -m "Update news feed and market posts"
          git push
